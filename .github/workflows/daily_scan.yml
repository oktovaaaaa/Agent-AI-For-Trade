name: Bot Hunter IDX Screener & Real-Time Alert

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode Pemindaian: 'realtime' (pantau pasar & alert instan) atau 'once' (scan 1x harian)"
        required: false
        default: "realtime"
      limit:
        description: "Batas jumlah saham untuk dianalisis (0 = semua saham lolos screener)"
        required: false
        default: "0"

jobs:
  run-scan:
    name: Pemantauan IDX & Alert WhatsApp
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependensi & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Jalankan Bot Hunter
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN || '7ci6H1WRqTDsJUAoFzq5' }}
          NOMOR_WHATSAPP_TUJUAN: ${{ secrets.NOMOR_WHATSAPP_TUJUAN || '120363430125223310@g.us' }}
          TRADINGVIEW_SESSIONID: ${{ secrets.TRADINGVIEW_SESSIONID || '999m9aq36s5hhqv7yw2vfubqvqhxbmj9,7ev2mzm8hgnx5zmu898kaa8g2nuzfc2i,yx4cryfynruplr29eryqu7qooc05mlex,kp2dfxh2grqbjsbjal140l3b9sgj9zl2,yblqlk1na0odzz71mu3y8il6igu229u1' }}
          NUM_WORKERS: "5"
          TZ: "Asia/Jakarta"
        run: |
          MODE="${{ github.event.inputs.mode || 'realtime' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"

          if [ "$MODE" = "once" ]; then
            if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
              echo "Menjalankan scan 1x dengan batas $LIMIT saham..."
              python bot_hunter.py --now --wa --limit "$LIMIT"
            else
              echo "Menjalankan scan harian 1x seluruh saham Hunter..."
              python bot_hunter.py --now --wa
            fi
          else
            if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
              echo "Menjalankan mode real-time intraday dengan batas $LIMIT saham..."
              python bot_hunter.py --realtime --session --limit "$LIMIT"
            else
              echo "Menjalankan mode real-time intraday per sesi..."
              python bot_hunter.py --realtime --session
            fi
          fi

      - name: Commit & Push Data Web Dashboard
        if: always()
        run: |
          git config --local user.email "oktovaaaaa@gmail.com"
          git config --local user.name "oktovaaaaa"
          git add docs/data/history.json || true
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data JSON."
          else
            git commit -m "Auto-update database scan saham & rotasi data 1 bulan [skip ci]"
            git checkout -- . || true
            git pull --rebase --autostash origin main
            git push origin main
          fi
